[project]
name = "golem-cli"
version = "0.1.0"
description = "CLI client for the Golem Agent-as-a-Service platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.3,<3",
  "pyyaml>=6.0.3",
  "typer>=0.27.1",
  "websockets>=16.1.1",
]

[project.scripts]
golem = "golem_cli.cli:main"

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "coverage>=7.11.0",
  "detect-secrets>=1.5.0",
  "mypy>=1.18.2",
  "poethepoet>=0.37.0",
  "pre-commit>=3.8.0",
  "pytest>=8.4.2",
  "radon>=6.0.1",
  "ruff>=0.8.0",
  "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
exclude = [".venv", "__pycache__", "build", "dist", "*.egg-info"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = []
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
lines-between-types = 0
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
